  stato: stimato
  fonte: foto, circa 42 px/mm
  dimensioni: [23.8, 20.0]
  spessore: 1.6
  altezza: 8.5            # condensatore 100 uF
  sotto: 0.5
  passo: 2.54
  file:
    - [3.2, 18.45, +x, [EN, IN3, IN2, IN1, GND]]
    - [3.2, 15.91, +x, [nFT, nSP, nRT, GND2, 3V3]]
    - [6.2, 1.2, +x, [M1, M2, M3]]
  pin:
    PWR-: [20.4, 14.8]
    PWR+: [20.1, 9.8]
  note: morsetti di potenza a passo 5 mm circa

tp4056:
  nome: TP4056 USB-C con protezione
  vista: come foto/caricatore-tp4056-usbc.jpg (USB a destra)
  stato: stimato
  fonte: >-
    foto quotata del venditore (modello HW-107 micro-USB, stessa disposizione delle piazzole):
    PCB 26,1 x 17,4, 27,9 con la presa sporgente. Piazzole d'angolo a ~1,4 dai bordi;
    B+ e B- in mezzo, ricavate in proporzione dalla foto (+-0,5). La scheda di Fabio è USB-C:
    lunghezza e altezza della presa da confermare.
  dimensioni: [26.1, 17.4]
  spessore: 1.0
  altezza: 3.3            # presa USB-C
  sotto: 0.3
  sporgenza_usb: 1.8      # 27,9 - 26,1
  pin:
    OUT-: [1.4, 16.0]
    B-: [1.4, 12.1]
    B+: [1.4, 5.3]
    OUT+: [1.4, 1.4]
    IN-: [24.7, 16.0]
    IN+: [24.7, 1.4]

