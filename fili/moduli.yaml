# Misure dei moduli: unica fonte per la geometria del rame.
#
# Convenzioni (uguali per tutti i moduli):
# - Scheda vista dal LATO COMPONENTI, nell'orientamento della foto indicata in "vista".
# - Origine (0, 0) nell'angolo IN BASSO A SINISTRA della scheda; x verso destra, y verso l'alto. Millimetri.
# - Ogni pin è il CENTRO del foro (o della piazzola) dove entra il filo di rame.
# - stato: "stimato" = ricavato da foto o da scheda tecnica; "misurato" = preso col calibro.
#   Il PDF di produzione non si genera finché c'è anche un solo valore stimato.
# - altezza = ingombro sopra la scheda (componente più alto); sotto = ingombro sotto la scheda.
#
# Come misurare col calibro (vedi fili/misure-da-prendere.md):
#   1. larghezza e altezza della scheda;
#   2. per ogni fila di pin: distanza del centro del PRIMO foro dal bordo sinistro e dal bordo inferiore;
#      gli altri fori della fila seguono il passo 2,54 (verificalo misurando primo-ultimo).

esp32s3:
  nome: ESP32-S3 SuperMini
  vista: USB in alto, chip verso l'osservatore
  stato: misurato
  fonte: >-
    calibro di Fabio (18/10/2026, misure al centro del foro): PCB 18 x 24, 25 con la USB-C;
    file a 1,0 dai bordi lunghi (interasse 16,0 misurato); GPIO7/GPIO8 a 1,2 dal bordo corto
    lontano dalla USB, gli altri a passo 2,54 (TX e 5V a 2,48 dal bordo della USB).
    Spessore 3 mm misurato da Fabio sul bordo.
  dimensioni: [18.0, 24.0]
  spessore: 3.0           # misurato da Fabio (atteso 1,0-1,2 per un PCB nudo)
  altezza: 3.2            # USB-C (HRO TYPE-C-31-M-12)
  sotto: 0.5              # gambe passanti della USB-C
  sporgenza_usb: 1.0      # 25 - 24
  passo: 2.54
  file:
    # [x del primo foro, y del primo foro, direzione (+y o -y), nomi in ordine]
    - [1.0, 21.52, -y, [GPIO43, GPIO44, GPIO1, GPIO2, GPIO3, GPIO4, GPIO5, GPIO6, GPIO7]]
    - [17.0, 21.52, -y, [5V, GND, 3V3, GPIO13, GPIO12, GPIO11, GPIO10, GPIO9, GPIO8]]
  note: >-
    GPIO43 = TX, GPIO44 = RX. USB-C centrata sul lato corto in alto, sporge 1,0;
    antenna ceramica sul lato corto opposto, tenere lontano il rame (ultimi ~3 mm).

simplefoc_mini:
  nome: SimpleFOC Mini v1.0 (2024-05-13)
  vista: come foto/driver-simplefoc-mini.jpg (connettore 2x5 in alto, condensatore in basso a destra)
  stato: misurato
  fonte: >-
    26 x 21,5 confermato col calibro da Fabio (18/10/2026).
    Disegno quotato del produttore (18/10/2026), ruotato di 180 gradi: 26 x 21,5 (+-0,2), 4 fori
    passanti Ø2 a interasse 22 x 17,5 (a 2,0 dai bordi), ingombro 11 in altezza con i pin.
    Pin ricavati dal disegno in scala (15,4 px/mm, +-0,1): connettore 2x5 sulla griglia 2,54.
  dimensioni: [26.0, 21.5]
  spessore: 1.6
  altezza: 8.0            # condensatore 100 uF e pin degli header (vista laterale)
  sotto: 1.5              # code dei pin sotto la scheda
  passo: 2.54
  file:
    - [5.08, 20.2, +x, [EN, IN3, IN2, IN1, GND]]
    - [5.08, 17.66, +x, [nFT, nSP, nRT, GND2, 3V3]]
    - [8.33, 1.22, +x, [M1, M2, M3]]
  pin:
    PWR-: [22.75, 15.52]
    PWR+: [22.75, 10.32]
  fori: [[2.0, 2.0], [24.0, 2.0], [2.0, 19.5], [24.0, 19.5]]
  note: >-
    i lobi dei fori sporgono: tra i fori la scheda è larga 22 (lati sinistro e destro rientrati).
    Morsetti di potenza a passo 5,2. Serigrafia della scheda di Fabio (v1.0, foto): fila EN-IN3-IN2-IN1-GND
    (GND quadrato), fila nFT-nSP-nRT-GND-3V3, motore M1-M2-M3 da sinistra (M3 quadrato), - in alto e + in basso.
    Attenzione: la v1.1 ha la fila IN in ordine inverso.

tp4056:
  nome: TP4056 USB-C con protezione
  vista: come foto/caricatore-tp4056-usbc.jpg (USB a destra)
  stato: stimato
  fonte: >-
    foto quotata del venditore (modello HW-107 micro-USB, stessa disposizione delle piazzole):
    PCB 26,1 x 17,4, 27,9 con la presa sporgente. Piazzole d'angolo a ~1,4 dai bordi;
    B+ e B- in mezzo, ricavate in proporzione dalla foto (+-0,5). La scheda di Fabio è USB-C:
    lunghezza e altezza della presa da confermare. Calibro di Fabio (18/10/2026): interasse
    OUT+/OUT- 14,0 e B+/B- 7,5, centrati sull'altezza stimata del PCB.
  dimensioni: [26.1, 17.4]
  spessore: 1.0
  altezza: 3.3            # presa USB-C
  sotto: 0.3
  sporgenza_usb: 1.8      # 27,9 - 26,1
  pin:
    OUT-: [1.4, 15.7]
    B-: [1.4, 12.45]
    B+: [1.4, 4.95]
    OUT+: [1.4, 1.7]
    IN-: [24.7, 15.7]
    IN+: [24.7, 1.7]

