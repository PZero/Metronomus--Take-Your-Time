as5600:
  nome: AS5600 (modulo bianco, 4 fori di fissaggio)
  vista: come la foto di dettaglio (VCC/OUT/GND a sinistra, DIR/SCL/SDA/GPO a destra)
  stato: misurato
  fonte: >-
    calibro di Fabio (18/10/2026, misure al centro del foro): PCB 22,5 x 22,5; file a 5,0 dai bordi;
    GND a 9,0 dal bordo inferiore, DIR a 6,0 dal bordo superiore; chip esattamente al centro
  dimensioni: [22.5, 22.5]
  spessore: 1.6
  altezza: 1.8
  sotto: 0.3
  passo: 2.54
  file:
    - [5.0, 14.08, -y, [VCC, OUT, GND]]
    - [17.5, 16.5, -y, [DIR, SCL, SDA, GPO]]
  pin:
    CHIP: [11.25, 11.25]  # centro del chip: va sull'asse del motore
  note: DIR e le pull-up di SDA/SCL da verificare col tester

vibrazione:
